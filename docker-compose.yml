version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: nextera_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: nextera
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  bot:
    build: .
    container_name: nextera_bot
    restart: always
    depends_on:
      - db
    env_file:
      - .env

volumes:
  pgdata:
